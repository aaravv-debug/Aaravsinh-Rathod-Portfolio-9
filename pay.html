<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Receipt - EditCraftStudio</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* TOP PRINTER DISPENSER */
    .printer-slot {
      width: 320px;
      height: 14px;
      background: #1e293b;
      border-radius: 8px 8px 2px 2px;
      box-shadow: inset 0 3px 6px #000, 0 4px 12px rgba(0,0,0,0.6);
      position: relative;
      z-index: 10;
      margin-bottom: -5px;
      border-bottom: 2px solid #0f172a;
    }

    /* THERMAL RECEIPT CONTAINER */
    .receipt-wrapper {
      width: 300px;
      position: relative;
      z-index: 5;
    }

    .receipt {
      width: 100%;
      background: #ffffff;
      color: #1e293b;
      padding: 24px 18px 30px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      transform-origin: top center;
      animation: printOut 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      clip-path: polygon(
        0% 0%, 100% 0%, 100% calc(100% - 10px),
        95% 100%, 90% calc(100% - 10px), 85% 100%, 80% calc(100% - 10px),
        75% 100%, 70% calc(100% - 10px), 65% 100%, 60% calc(100% - 10px),
        55% 100%, 50% calc(100% - 10px), 45% 100%, 40% calc(100% - 10px),
        35% 100%, 30% calc(100% - 10px), 25% 100%, 20% calc(100% - 10px),
        15% 100%, 10% calc(100% - 10px), 5% 100%, 0% calc(100% - 10px)
      );
    }

    @keyframes printOut {
      0% { transform: translateY(-100%) scaleY(0.2); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translateY(0) scaleY(1); opacity: 1; }
    }

    /* HEADER */
    .receipt-header {
      text-align: center;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #0f172a;
      text-transform: uppercase;
    }
    .receipt-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    /* BODY */
    .receipt-body {
      font-size: 12px;
      line-height: 1.8;
      color: #334155;
    }
    .row {
      display: flex;
      justify-content: space-between;
    }
    .row.bold {
      font-weight: 700;
      color: #0f172a;
    }

    .divider {
      border-top: 2px dashed #cbd5e1;
      margin: 10px 0;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 8px 0;
    }
    .total-label {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }
    .total-amount {
      font-size: 26px;
      font-weight: 900;
      color: #0f172a;
    }

    /* RUBBER INK PAID STAMP */
    .stamp {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-14deg) scale(2.2);
      border: 4px solid #16a34a;
      color: #16a34a;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      padding: 5px 18px;
      border-radius: 8px;
      letter-spacing: 3px;
      opacity: 0;
      animation: stampDrop 0.5s 1.2s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      pointer-events: none;
    }

    @keyframes stampDrop {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-14deg) scale(2.5); }
      100% { opacity: 0.92; transform: translate(-50%, -50%) rotate(-14deg) scale(1); }
    }

    /* BARCODE */
    .barcode {
      text-align: center;
      margin-top: 18px;
    }
    .barcode svg {
      width: 170px;
      height: 38px;
    }

    /* ACTION BUTTONS */
    .pay-actions {
      margin-top: 22px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-gpay { background: #1a73e8; }
    .btn-phonepe { background: #5f259f; }
    .btn-paytm { background: #00b9f5; }
    .btn-upi { background: #16a34a; }
    .btn-preview {
      background: #334155;
      font-size: 12px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- PRINTER DISPENSER SLOT -->
  <div class="printer-slot"></div>

  <!-- RECEIPT WRAPPER -->
  <div class="receipt-wrapper">
    <div class="receipt">
      <div class="stamp" id="paidStamp">PAID</div>

      <div class="receipt-header">
        <h1 class="brand-name" id="displayBrand">EditCraftStudio</h1>
        <p class="receipt-sub">Official Digital Tax Receipt</p>
        <p class="receipt-sub" id="displayDate"></p>
      </div>

      <div class="receipt-body">
        <div class="row"><span>Invoice No:</span><span class="bold" id="displayInv">INV-1002</span></div>
        <div class="row"><span>Merchant UPI:</span><span id="displayUpi">saiaaravv@okicici</span></div>
        <div class="row"><span>Status:</span><span style="color:#16a34a; font-weight:bold;">Verified</span></div>

        <div class="divider"></div>

        <div class="row"><span>Video Editing & Media</span><span id="displayServiceAmt">₹10</span></div>
        <div class="row"><span>Platform / Tech Fee</span><span>₹0.00</span></div>

        <div class="divider"></div>

        <div class="total-box">
          <span class="total-label">TOTAL AMOUNT</span>
          <span class="total-amount" id="displayTotal">₹10</span>
        </div>
      </div>

      <div class="barcode">
        <svg viewBox="0 0 100 25">
          <rect width="2" height="25" x="5" fill="#1e293b"/>
          <rect width="1" height="25" x="9" fill="#1e293b"/>
          <rect width="3" height="25" x="12" fill="#1e293b"/>
          <rect width="1" height="25" x="18" fill="#1e293b"/>
          <rect width="2" height="25" x="22" fill="#1e293b"/>
          <rect width="4" height="25" x="27" fill="#1e293b"/>
          <rect width="1" height="25" x="34" fill="#1e293b"/>
          <rect width="3" height="25" x="38" fill="#1e293b"/>
          <rect width="2" height="25" x="44" fill="#1e293b"/>
          <rect width="1" height="25" x="49" fill="#1e293b"/>
          <rect width="4" height="25" x="53" fill="#1e293b"/>
          <rect width="2" height="25" x="60" fill="#1e293b"/>
          <rect width="3" height="25" x="69" fill="#1e293b"/>
          <rect width="2" height="25" x="75" fill="#1e293b"/>
          <rect width="4" height="25" x="80" fill="#1e293b"/>
          <rect width="1" height="25" x="87" fill="#1e293b"/>
          <rect width="2" height="25" x="91" fill="#1e293b"/>
        </svg>
        <p style="font-size: 10px; color: #94a3b8; margin-top: 4px;">THANK YOU FOR YOUR BUSINESS</p>
      </div>
    </div>
  </div>

  <!-- PAYMENT BUTTONS -->
  <div class="pay-actions">
    <a id="btnGpay" href="#" class="btn btn-gpay">🔵 Pay with Google Pay</a>
    <a id="btnPhonepe" href="#" class="btn btn-phonepe">🟣 Pay with PhonePe</a>
    <a id="btnPaytm" href="#" class="btn btn-paytm">🔷 Pay with Paytm</a>
    <a id="btnUniversal" href="#" class="btn btn-upi">⚡ Pay with Any UPI App</a>
    <button onclick="triggerConfetti()" class="btn btn-preview">🎉 Replay Celebration</button>
  </div>

  <script>
    // Read URL Parameters
    const params = new URLSearchParams(window.location.search);
    const upiId = params.get('pa') || 'saiaaravv@okicici';
    const brand = params.get('pn') || 'EditCraftStudio';
    const amount = params.get('am') || '10';
    const invNo = params.get('inv') || 'INV-1002';

    // Populate Dynamic Content
    document.getElementById('displayBrand').textContent = brand;
    document.getElementById('displayInv').textContent = invNo;
    document.getElementById('displayUpi').textContent = upiId;
    document.getElementById('displayTotal').textContent = '₹' + amount;
    document.getElementById('displayServiceAmt').textContent = '₹' + amount;
    document.getElementById('displayDate').textContent = new Date().toLocaleDateString('en-IN', {
      day: '2-digit', month: 'short', year: 'numeric'
    }) + ' • Verified';

    // Build UPI Links & Android Direct Intents
    const query = `pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(brand)}&am=${encodeURIComponent(amount)}&cu=INR&tn=${encodeURIComponent(invNo)}`;
    
    document.getElementById('btnGpay').href = `intent://pay?${query}#Intent;scheme=upi;package=com.google.android.apps.nbu.paisa.user;end`;
    document.getElementById('btnPhonepe').href = `intent://pay?${query}#Intent;scheme=upi;package=com.phonepe.app;end`;
    document.getElementById('btnPaytm').href = `intent://pay?${query}#Intent;scheme=upi;package=net.one97.paytm;end`;
    document.getElementById('btnUniversal').href = `upi://pay?${query}`;

    // Confetti Animation
    function triggerConfetti() {
      confetti({
        particleCount: 80,
        spread: 70,
        origin: { y: 0.6 }
      });
    }

    // Trigger confetti right after receipt rolls out
    setTimeout(triggerConfetti, 1400);
  </script>
</body>
</html>
